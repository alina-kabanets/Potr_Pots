<!-- #region head -->
<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Potr Pots</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <script
      src="scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <header class="header">
      <div class="header__container__top">
        <div class="header__top">
          <a
            href="#"
            class="header__top__logo"
          >
            Potr Pots
          </a>
          <a
            href="#menu"
            class="header__top__icon icon-menu"
          ></a>
        </div>
      </div>

      <img
        src="images/mobile/header-bg-mobile.png"
        alt="Potr Pots Image"
        class="header__image"
      />

      <div class="header__bottom">
        <h2 class="header__bottom__title">
          POTR ~ Eco, self-
          <span class="header__bottom__title--solid">watering, origami</span>
          plant
          <span class="header__bottom__title--solid">pots</span>
        </h2>

        <div class="header__bottom__ad">
          <p class="header__bottom__ad__price">$ 7.50</p>
          <p class="header__bottom__ad__text">
            Get the second order
            <br />
            in half price
          </p>
          <div class="header__bottom__ad__buy-now">
            <a
              href="#buy-now"
              class="header__bottom__ad__buy-now__link"
            >
              Buy now
            </a>
            <div class="header__bottom__ad__buy-now__arrow">&#x27F6;</div>
          </div>

          
        </div>

        <div class="header__side">
          <a
            href="#features"
            class="header__side__link"
          >
            More about POTR POTS
          </a>
          <a
            href="#features"
            class="header__side__arrow"
          ></a>
        </div>
      </div>
    </header>

    <aside
      class="menu page__menu"
      id="menu"
    >
      <div class="menu__top">
        <a
          href="#"
          class="icon-menu"
        ></a>
      </div>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#basket"
              class="nav__link"
            >
              Basket
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#features"
              class="nav__link"
            >
              Features
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#materials"
              class="nav__link"
            >
              Materials
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#about-us"
              class="nav__link"
            >
              About us
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#message-us"
              class="nav__link"
            >
              Message us
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <div class="container">
      <main class="main">
        <section
          class="for-whom"
          id=""
        >
          <h2>For whom?</h2>
        </section>

        <section
          class="features"
          id="features"
        >
          <h2>POTR Pots Features</h2>
        </section>

        <section
          class="about-us"
          id="about-us"
        >
          <h2>Meet the POTR team!</h2>
        </section>

        <section
          class="materials"
          id="materials"
        >
          <h2>Materials and Features</h2>
        </section>

        <section
          class="message-us"
          id="message-us"
        >
          <h2>have any questions?</h2>
        </section>
      </main>
    </div>

    <footer class="footer"></footer>
  </body>
</html>
